services:
  app:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:-news_local_password}@postgres:5432/${POSTGRES_DB:-news}
      KAFKA_URL: kafka:19092
      NEWS_TOPIC: ${NEWS_TOPIC:-news.created}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    networks:
      default: {}
      alfa-services: {}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news}
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.2
    restart: unless-stopped
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    networks:
      default: {}
      alfa-services:
        aliases:
          - news-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12

  kafka-volume-init:
    image: busybox:1.37
    restart: "no"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    command:
      - sh
      - -ec
      - >-
        mkdir -p /tmp/kraft-combined-logs &&
        chmod -R a+rwx /tmp/kraft-combined-logs

  kafka-init:
    image: apache/kafka:4.1.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      NEWS_TOPIC: ${NEWS_TOPIC:-news.created}
      ANALYSIS_REQUEST_TOPIC: ${ANALYSIS_REQUEST_TOPIC:-insight.requested}
      ANALYSIS_RESPONSE_TOPIC: ${ANALYSIS_RESPONSE_TOPIC:-insight.completed}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'for topic in "$$NEWS_TOPIC" "$$ANALYSIS_REQUEST_TOPIC" "$$ANALYSIS_RESPONSE_TOPIC"; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1; done'
    networks:
      - alfa-services

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - alfa-services
    environment:
      KAFKA_CLUSTERS_0_NAME: news-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  postgres_data:
  kafka_data:

networks:
  alfa-services:
    name: alfa-services
